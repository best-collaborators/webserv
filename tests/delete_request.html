<!DOCTYPE html>
<html>
<head>
    <title>Delete Request Example</title>
</head>
<body>

<h2>Delete Resource</h2>

<button onclick="deleteResource()">Delete Item</button>

<script>
function deleteResource() {
    fetch("http://127.0.0.1:3490/cat.jpg", {
        method: "DELETE",
        headers: {
            "Content-Type": "application/json"
        }
    })
    .then(response => {
        if (response.ok) {
            alert("Deleted successfully!");
        } else {
            alert("Delete failed!");
        }
    })
    .catch(error => {
        console.error("Error:", error);
    });
}
</script>

</body>
</html>
