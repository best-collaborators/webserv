server:

	listen:
		127.0.0.1:3490

	server_name             :             [example.com]

	error_pages:
		400:/index/400.html
		500:/html_errors/500ErrorPage.html
		404:/BadRequestPage.html

	root: ./
	index: root_index.html

	locations:
		- path: /
			allowed_methods: "GET"

		- path: /post_body
			max_body_size: 100000000000
			allowed_methods: "POST"

		- path: /directory
			allowed_methods: "GET"
			index: youpi.bad_extension
			root: YoupiBanane

		- path: /videos
			allowed_methods: "GET  | POST"
			index:       0-upload.txt

		   - path: /private
			allowed_methods: "GET"
			index:       0-upload.txt

	cgi:
		- pass_to: /usr/bin/python3
			extensions: ".bla"
			allowed_methods: "GET|POST"
			max_body_size: 1000000000

server:

	listen:
		127.0.0.5:8000

	server_name             :             [example.com]

	root: data

	locations:

		- path: /some/random/dir2
			allowed_methods:     " GET|POST|DELETE"             
			index: index.html

		- path: /some/rando
			allowed_methods: "GET  | POST"
			index:       index.html
			max_body_size: 1000
			autoindex: on

	error_pages:
		400:/index/400.html
		500:/html_errors/500ErrorPage.html
		404:/BadRequestPage.html
	index: root_index.html




