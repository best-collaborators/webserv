server:
	listen:
		127.0.0.1:1111

	error_pages:
		400: /BadRequestPage.html

	root: ./data
	index: /another/index.html

	locations:
		- path: /old
			allowed_methods: "GET"
			redirect: 301 /new

		- path: /new
			allowed_methods: "GET"
			autoindex: on

		- path: /post_body
			max_body_size: 1000000000
			allowed_methods: "GET|POST|DELETE"
			index: /another/0-upload.txt
			autoindex: on

		- path: /directory
			allowed_methods: "GET"
			index: youpi.bad_extension
			root: ../../../YoupiBanane
		- path: /YoupiBanane
			allowed_methods: "GET"
			index: youpi.bad_extension

	cgi:
		- pass_to: /usr/bin/node
			extensions: ".js"

server:
	listen:
		127.0.0.5:8000

	root: ./data
	index: root_index.html

	locations:
		- path: /some/random/dir2
			allowed_methods: "GET|POST|DELETE"
			index: index.html

		- path: /some/rando
			allowed_methods: "GET|POST"
			index: index.html
			max_body_size: 1000
			autoindex: on

	error_pages:
		400: /index/400.html
		500: /html_errors/500ErrorPage.html
		404: /BadRequestPage.html